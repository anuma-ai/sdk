name: Check generated docs
permissions:
  contents: read
on:
  merge_group:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate docs
        run: pnpm generate

      - name: Check if docs changed
        id: changes
        run: |
          git add docs/
          git diff --staged --quiet docs/ || echo "docs_changed=true" >> $GITHUB_OUTPUT

      - name: Fail if docs changed
        if: steps.changes.outputs.docs_changed == 'true'
        run: |
          echo "❌ Changes detected in docs/ after running 'pnpm generate'"
          echo "Please run 'pnpm generate' locally and commit the changes."
          echo ""
          echo "Changed files:"
          git status docs/
          echo ""
          echo "Diff:"
          git diff --staged docs/
          exit 1
