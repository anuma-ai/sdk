name: Check generated docs
permissions:
  contents: read
on:
  merge_group:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate docs
        run: pnpm generate

      - name: Check if docs changed
        id: changes
        run: |
          git add docs/
          git diff --staged --quiet docs/ || echo "docs_changed=true" >> $GITHUB_OUTPUT

      - name: Fail if docs changed
        if: steps.changes.outputs.docs_changed == 'true'
        run: |
          echo "❌ Changes detected in docs/ after running 'pnpm generate'"
          echo "Please run 'pnpm generate' locally and commit the changes."
          echo ""
          echo "Changed files:"
          git status docs/
          echo ""
          echo "Diff:"
          git diff --staged docs/
          exit 1
