name: Consolidation Eval

# Quality gate for the consolidation "decide" step — the memory pipeline's
# judgment call (create / update / supersede / noop). A weak decision leaves
# stale contradictions in the vault or silently degrades to a create-fallback.
#
# Gate scope, stated honestly: the corpus is 7 hand-labelled cases, so this
# detects a COLLAPSE (broken prompt, schema the model can't satisfy, fallback
# storm), not fine-grained drift. It runs 15 passes so the mean is stable —
# a 5-pass mean swings between 82.9% and 100% on an unchanged model, which
# would make a tighter gate flaky rather than useful.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = fail on regression vs committed baseline; save-baseline = write a new baseline artifact; sweep = compare candidate models (no gate)"
        required: false
        type: choice
        default: "gate"
        options: ["gate", "save-baseline", "sweep"]
      runs:
        description: "Passes over the corpus. 15 matches the committed baseline; the benchmark REFUSES to gate on a mismatch."
        required: false
        type: string
        default: "15"
      models:
        description: "Comma-separated models. Blank = the live decide model for gate/save-baseline, or the 4-model candidate line-up for a sweep."
        required: false
        type: string
        default: ""
  # ADVISORY gate — see .github/workflows/EVAL_GATES.md for why, and for the
  # three-step recipe to make it blocking. In short: paths-scoped means no run
  # (and so NO status) on an unrelated PR, which is why `consolidation-eval-status` must not
  # be added to main's required checks in this shape.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/consolidation-eval.yml"
      - "src/lib/memory/consolidate.ts"
      - "test/memory/src/consolidation/**"
      - "test/memory/src/gate.ts"
# Every job below spends real Cerebras quota against the shared dev portal, and
# that quota is account-wide — a superseded run left in flight competes with the
# run that replaced it, and (2026-07-28) starved prod chat completions on
# cerebras/gpt-oss-120b for ~40 minutes. Cancel the old run on a new push.
# NOTE: this serializes per branch only — runs from DIFFERENT branches still
# stack against the same account-wide quota, so it narrows the window rather
# than closing it. Full isolation needs a separate upstream account for CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel ONLY on pull_request. A blanket `true` would also cancel the
  # push-to-main run, and on recall/vault-search that run is the sole seeder of
  # the shared dataset + embedding caches — a run of merges would cancel it
  # repeatedly and send every PR back to a cold start (HuggingFace 429s on the
  # dataset pull). false makes those queue instead, so seeding still completes
  # and concurrent runs are serialized rather than stacked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consolidation-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      # Free-form inputs via env (not ${{ }} inline) so the shell tokenizes
      # after substitution — blocks command injection from the dispatch UI.
      INPUT_MODE: ${{ inputs.mode || 'gate' }}
      INPUT_RUNS: ${{ inputs.runs || '15' }}
      INPUT_MODELS: ${{ inputs.models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm BEFORE setup-node: `cache: "pnpm"` resolves the store by running
      # `pnpm store path`, so pnpm has to be on PATH by then. Corepack-enabling
      # afterwards (what this workflow used to do) left setup-node with no pnpm and
      # no cache, which is why these runs re-downloaded all ~1610 packages every
      # time. Matches test.yml, which has always had it in this order.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        # --frozen-lockfile so a lockfile that drifted from package.json fails here
        # instead of being silently re-resolved, which also means the restored store
        # is always the one the lockfile describes.
        run: pnpm install --frozen-lockfile

      - name: Build eval args
        run: |
          args=(--json --runs "$INPUT_RUNS")
          [ -n "$INPUT_MODELS" ] && args+=(--models "$INPUT_MODELS")
          printf 'EVAL_ARGS=%s\n' "${args[*]}" >> "$GITHUB_ENV"

      # `pnpm --silent` so the lifecycle banner doesn't precede the JSON on
      # stdout and break every `jq` below.
      - name: Run eval (regression gate)
        if: env.INPUT_MODE == 'gate'
        run: |
          # pipefail so the gate's non-zero exit isn't swallowed by tee.
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS --baseline test/memory/src/consolidation/baseline.json | tee results.json

      - name: Run eval (save baseline)
        if: env.INPUT_MODE == 'save-baseline'
        run: |
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS --save-baseline | tee results.json
          echo "### Generated baseline" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat test/memory/src/consolidation/baseline.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated baseline
        if: env.INPUT_MODE == 'save-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consolidation-baseline
          path: test/memory/src/consolidation/baseline.json
          if-no-files-found: error

      - name: Run eval (model sweep, no gate)
        if: env.INPUT_MODE == 'sweep'
        run: |
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS | tee results.json

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Consolidation eval (${INPUT_MODE}, ${INPUT_RUNS} passes)"
            if [ -f results.json ]; then
              echo '```'
              jq -r '
                .models | to_entries[] |
                "  \(.key)",
                "    accuracy      : \((.value.mean.overallAccuracy*1000|round/10))%",
                "    fallback rate : \((.value.mean.fallbackRate*1000|round/10))%",
                (.value.byCategory | to_entries[] |
                  "      \(.key | . + (" " * (18 - length)))\(.value.pass)/\(.value.total)")
              ' results.json 2>/dev/null || echo "  (could not parse results.json)"
              echo '```'
            else
              echo "_No result (the eval step failed before writing results.json)._"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consolidation-eval-results
          path: results.json
          if-no-files-found: ignore

  # Reports this gate's outcome as one stable line. See the advisory note on
  # the pull_request trigger for why it is not a required check today.
  consolidation-eval-status:
    if: always()
    needs: [consolidation-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Check consolidation gate result
        run: |
          # Allowlist, not a failure check: a timed-out job concludes
          # `cancelled` and would otherwise post green. See EVAL_GATES.md.
          result="${{ needs.consolidation-eval.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "Consolidation eval gate did not pass (result: $result)"
            exit 1
          fi
          echo "Consolidation eval gate passed"
