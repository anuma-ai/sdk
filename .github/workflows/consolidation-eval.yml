name: Consolidation Eval

# Quality gate for the consolidation "decide" step — the memory pipeline's
# judgment call (create / update / supersede / noop). A weak decision leaves
# stale contradictions in the vault or silently degrades to a create-fallback.
#
# Gate scope, stated honestly: the corpus is 7 hand-labelled cases, so this
# detects a COLLAPSE (broken prompt, schema the model can't satisfy, fallback
# storm), not fine-grained drift. It runs 15 passes so the mean is stable —
# a 5-pass mean swings between 82.9% and 100% on an unchanged model, which
# would make a tighter gate flaky rather than useful.
on:
  # Runs in the merge queue with NO paths filter, so the status below is always
  # produced there and can therefore be a REQUIRED check. The paths-scoped
  # pull_request trigger stays for early signal during review; a required check
  # that never reports on an unrelated PR would block it forever.
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = fail on regression vs committed baseline; save-baseline = write a new baseline artifact; sweep = compare candidate models (no gate)"
        required: false
        type: choice
        default: "gate"
        options: ["gate", "save-baseline", "sweep"]
      runs:
        description: "Passes over the corpus. 15 matches the committed baseline; the benchmark REFUSES to gate on a mismatch."
        required: false
        type: string
        default: "15"
      models:
        description: "Comma-separated models. Blank = the live decide model for gate/save-baseline, or the 4-model candidate line-up for a sweep."
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/consolidation-eval.yml"
      - "src/lib/memory/consolidate.ts"
      - "test/memory/src/consolidation/**"
      - "test/memory/src/gate.ts"

jobs:
  consolidation-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      # Free-form inputs via env (not ${{ }} inline) so the shell tokenizes
      # after substitution — blocks command injection from the dispatch UI.
      INPUT_MODE: ${{ inputs.mode || 'gate' }}
      INPUT_RUNS: ${{ inputs.runs || '15' }}
      INPUT_MODELS: ${{ inputs.models }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install

      - name: Build eval args
        run: |
          args=(--json --runs "$INPUT_RUNS")
          [ -n "$INPUT_MODELS" ] && args+=(--models "$INPUT_MODELS")
          printf 'EVAL_ARGS=%s\n' "${args[*]}" >> "$GITHUB_ENV"

      # `pnpm --silent` so the lifecycle banner doesn't precede the JSON on
      # stdout and break every `jq` below.
      - name: Run eval (regression gate)
        if: env.INPUT_MODE == 'gate'
        run: |
          # pipefail so the gate's non-zero exit isn't swallowed by tee.
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS --baseline test/memory/src/consolidation/baseline.json | tee results.json

      - name: Run eval (save baseline)
        if: env.INPUT_MODE == 'save-baseline'
        run: |
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS --save-baseline | tee results.json
          echo "### Generated baseline" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat test/memory/src/consolidation/baseline.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated baseline
        if: env.INPUT_MODE == 'save-baseline'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidation-baseline
          path: test/memory/src/consolidation/baseline.json
          if-no-files-found: error

      - name: Run eval (model sweep, no gate)
        if: env.INPUT_MODE == 'sweep'
        run: |
          set -o pipefail
          pnpm --silent eval:consolidation $EVAL_ARGS | tee results.json

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Consolidation eval (${INPUT_MODE}, ${INPUT_RUNS} passes)"
            if [ -f results.json ]; then
              echo '```'
              jq -r '
                .models | to_entries[] |
                "  \(.key)",
                "    accuracy      : \((.value.mean.overallAccuracy*1000|round/10))%",
                "    fallback rate : \((.value.mean.fallbackRate*1000|round/10))%",
                (.value.byCategory | to_entries[] |
                  "      \(.key | . + (" " * (18 - length)))\(.value.pass)/\(.value.total)")
              ' results.json 2>/dev/null || echo "  (could not parse results.json)"
              echo '```'
            else
              echo "_No result (the eval step failed before writing results.json)._"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consolidation-eval-results
          path: results.json
          if-no-files-found: ignore

  # Aggregator whose context is stable whatever the gate above did — the shape
  # `e2e-tools-status` uses, and the only one safe to add to main's ruleset.
  # Passes when the gate is skipped (paths didn't match), fails only when it
  # actually failed. NOTE: adding `consolidation-eval-status` to ruleset 9764137 needs
  # repo admin; until then this reports but cannot block.
  consolidation-eval-status:
    if: always()
    needs: [consolidation-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Check consolidation gate result
        run: |
          if [[ "${{ needs.consolidation-eval.result }}" == "failure" ]]; then
            echo "Consolidation eval gate failed"
            exit 1
          fi
          echo "Consolidation eval gate passed (or was skipped)"
