name: Recall Eval

# Bounded LongMemEval retrieval gate for recall-ranking changes.
#
# Why a separate workflow instead of a `pull_request` trigger on longmemeval.yml:
# that workflow's dispatch inputs are all `required: true` (they resolve BLANK on
# a pull_request event, which has no inputs), and its final step PUSHES results
# to the `benchmarks` branch — a PR must never do that. Cloning just the setup +
# cache steps has a far smaller blast radius than retrofitting both behaviours.
#
# WHAT THIS GATES — retrieval only:
#   blocking : retrieval avgRecall + avgPrecision
#   reported : answer accuracy (NEVER blocking)
# Accuracy depends on the answer LLM and the judge, and it fails independently of
# retrieval: at the time this gate was written a clean 50-question run measured
# 95.5% retrieval recall alongside 0.0% accuracy across every question type (see
# the harness issue), and the `benchmarks` branch holds recall runs at 0–1.8%
# accuracy beside healthy ~80% ones. Gating accuracy would red PRs for outages
# the PR didn't cause. Retrieval is what a ranking change actually moves.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = fail on retrieval regression vs committed baseline; save-baseline = write a new baseline artifact"
        required: false
        type: choice
        default: "gate"
        options: ["gate", "save-baseline"]
      baseline_repeat:
        description: "save-baseline only: captures to average. 1 writes a luck-dependent baseline — the harness warns about it."
        required: false
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
  # PORTAL_API_KEY reaches PR-authored code here, same as extraction-eval.yml and
  # the other eval gates. That's the accepted posture for this repo, not an
  # oversight: fork PRs receive no secrets (so an outside contributor's code can
  # never see the key and the job simply fails), and same-repo branches are
  # pushed by people who already hold repo write access — they can read the
  # secret directly, so the workflow grants them nothing new. Revisit only if
  # this repo starts accepting fork PRs.
  # ADVISORY gate — see .github/workflows/EVAL_GATES.md for why, and for the
  # three-step recipe to make it blocking. In short: paths-scoped means no run
  # (and so NO status) on an unrelated PR, which is why `recall-eval-status` must not
  # be added to main's required checks in this shape.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recall-eval.yml"
      # The recall/ranking stack — same surface the vault-search gate watches.
      # Both fire on a ranking PR by design: vault-search is the cheap
      # deterministic signal, this one is the end-to-end retrieval check.
      - "src/lib/memory/recall.ts"
      - "src/lib/memory/recallConstants.ts"
      - "src/lib/memory/recallTool.ts"
      - "src/lib/memory/rrf.ts"
      - "src/lib/memory/mmr.ts"
      - "src/lib/memory/recency.ts"
      - "src/lib/memory/queryEntities.ts"
      - "src/lib/memory/queryTemporal.ts"
      - "src/lib/memory/graphTraversal.ts"
      - "src/lib/memory/retain.ts"
      - "src/lib/memoryVault/**"
      # The candidate-set filtering itself. searchTool calls
      # getVaultCandidateKeysOp / getAllVaultMemoriesOp on every search, so the
      # scope/folder/factTypes/includeArchived logic that decides WHICH rows are
      # even eligible lives here. Without this glob a change confined to the DB
      # layer skips the gate entirely — #780 is exactly such a change and only
      # tripped these gates because it happened to also touch searchTool.ts.
      - "src/lib/db/memoryVault/**"
      # Every score here is computed over embeddings, so an embedding-model or
      # chunking change moves retrieval without touching a ranking file.
      - "src/lib/memoryEngine/**"
      # The harness + shared gate helper.
      - "test/memory/longmemeval.ts"
      - "test/memory/src/longmemeval/**"
      - "test/memory/src/gate.ts"
  # The ONLY thing that seeds the shared caches. Actions scopes a cache to the
  # ref that created it, so one born under refs/pull/N/merge is invisible to
  # every other PR; without this main-branch run each PR cold-starts and re-pulls
  # the dataset (HuggingFace 429s) and re-embeds. With merge_group now removed
  # this is the sole seeder — do not prune it as a duplicate of the PR trigger.
  push:
    branches: [main]
    paths:
      - ".github/workflows/recall-eval.yml"
      # The recall/ranking stack — same surface the vault-search gate watches.
      # Both fire on a ranking PR by design: vault-search is the cheap
      # deterministic signal, this one is the end-to-end retrieval check.
      - "src/lib/memory/recall.ts"
      - "src/lib/memory/recallConstants.ts"
      - "src/lib/memory/recallTool.ts"
      - "src/lib/memory/rrf.ts"
      - "src/lib/memory/mmr.ts"
      - "src/lib/memory/recency.ts"
      - "src/lib/memory/queryEntities.ts"
      - "src/lib/memory/queryTemporal.ts"
      - "src/lib/memory/graphTraversal.ts"
      - "src/lib/memory/retain.ts"
      - "src/lib/memoryVault/**"
      # The candidate-set filtering itself. searchTool calls
      # getVaultCandidateKeysOp / getAllVaultMemoriesOp on every search, so the
      # scope/folder/factTypes/includeArchived logic that decides WHICH rows are
      # even eligible lives here. Without this glob a change confined to the DB
      # layer skips the gate entirely — #780 is exactly such a change and only
      # tripped these gates because it happened to also touch searchTool.ts.
      - "src/lib/db/memoryVault/**"
      # Every score here is computed over embeddings, so an embedding-model or
      # chunking change moves retrieval without touching a ranking file.
      - "src/lib/memoryEngine/**"
      # The harness + shared gate helper.
      - "test/memory/longmemeval.ts"
      - "test/memory/src/longmemeval/**"
      - "test/memory/src/gate.ts"

jobs:
  recall-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      INPUT_MODE: ${{ inputs.mode || 'gate' }}
      # Free-form input via env so the shell tokenizes after substitution.
      # Without this the save-baseline path wrote a ONE-run baseline, quietly
      # undoing the multi-run mean the gate is designed around.
      INPUT_BASELINE_REPEAT: ${{ inputs.baseline_repeat || '3' }}
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install

      # HuggingFace rate-limits the dataset endpoint and 429s on repeat pulls,
      # so persist the oracle dataset + embedding cache across runs.
      #
      # There is deliberately NO `--preload` step: that helper fetches all three
      # variants (s, m, oracle), and this gate only ever reads oracle — so it
      # would download two large files the cache doesn't keep, on every run,
      # re-introducing exactly the 429 exposure this cache exists to remove.
      # `loadLongMemEvalDataset` fetches on demand, so the eval pulls oracle
      # itself on a cold cache and reuses it on every warm one.
      - name: Restore longmemeval cache (oracle dataset + embeddings)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/longmemeval/embedding-cache-*.json
            ~/.cache/longmemeval/longmemeval_oracle.json
          key: longmemeval-recall-gate-v1

      # The pinned bounded config. Every knob here is RECORDED in the baseline
      # and the harness refuses to gate on a mismatch, so changing any of them
      # requires regenerating the baseline — they can't drift apart silently.
      #   --max 50            : ~2.5 min end to end; enough sample for an 8pt floor
      #   --decompose=off     : drops the LLM query-decomposition call
      #   --consolidate=false : drops the LLM retain-time consolidation call
      #   --rerank=false      : drops the native cross-encoder (also avoids a
      #                         teardown crash in the ONNX runtime)
      - name: Run recall gate
        if: env.INPUT_MODE == 'gate'
        run: |
          set -o pipefail
          pnpm --silent eval:longmemeval \
            --strategy recall --variant oracle --max 50 \
            --llm gpt-oss/gpt-oss-120b --extract-llm gpt-oss/gpt-oss-120b \
            --concurrency 10 --decompose=off --consolidate=false --rerank=false \
            --output results.json \
            --baseline test/memory/src/longmemeval/recall-baseline.json

      - name: Run recall eval (save baseline)
        if: env.INPUT_MODE == 'save-baseline'
        run: |
          set -o pipefail
          pnpm --silent eval:longmemeval \
            --strategy recall --variant oracle --max 50 \
            --llm gpt-oss/gpt-oss-120b --extract-llm gpt-oss/gpt-oss-120b \
            --concurrency 10 --decompose=off --consolidate=false --rerank=false \
            --output results.json --save-baseline \
            --baseline-repeat "$INPUT_BASELINE_REPEAT"
          echo "### Generated recall baseline" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat test/memory/src/longmemeval/recall-baseline.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated baseline
        if: env.INPUT_MODE == 'save-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-baseline
          path: test/memory/src/longmemeval/recall-baseline.json
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Recall eval — retrieval gate (oracle, 50 questions)"
            if [ -f results.json ]; then
              echo '```'
              jq -r '
                "  BLOCKING — retrieval:",
                "    recall    : \((.retrieval.avgRecall*1000|round/10))%",
                "    precision : \((.retrieval.avgPrecision*1000|round/10))%",
                "",
                "  reported only (never gates):",
                "    accuracy  : \((.accuracy*1000|round/10))%  (\(.correctAnswers)/\(.totalQuestions))"
              ' results.json 2>/dev/null || echo "  (could not parse results.json)"
              echo '```'
            else
              echo "_No result (the eval failed before writing results.json)._"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-eval-results
          path: results.json
          if-no-files-found: ignore

  # Reports this gate's outcome as one stable line. See the advisory note on
  # the pull_request trigger for why it is not a required check today.
  recall-eval-status:
    if: always()
    needs: [recall-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Check recall gate result
        run: |
          # Allowlist, not a failure check: a timed-out job concludes
          # `cancelled` and would otherwise post green. See EVAL_GATES.md.
          result="${{ needs.recall-eval.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "Recall eval gate did not pass (result: $result)"
            exit 1
          fi
          echo "Recall eval gate passed"
