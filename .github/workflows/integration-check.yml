name: Integration Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ref: [pr, main]
        repo:
          [
            starter-next,
            starter-mini,
            starter-telegram,
            starter-agent,
            dashboard,
            text,
            cli,
            ai-memoryless-client,
          ]
        include:
          - repo: starter-next
            e2e: true
          - repo: starter-mini
            e2e: false
          - repo: starter-telegram
            e2e: false
          - repo: dashboard
            e2e: false
          - repo: text
            e2e: false
          - repo: starter-agent
            e2e: false
          - repo: cli
            e2e: false
          - repo: ai-memoryless-client
            e2e: false
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
      NEXT_PUBLIC_DROPBOX_APP_KEY: ${{ secrets.NEXT_PUBLIC_DROPBOX_APP_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || '' }}

      - name: Ensure packageManager field
        run: |
          if ! grep -q '"packageManager"' package.json; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.packageManager = 'pnpm@10.23.0';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK
        run: pnpm build

      - name: Pack SDK
        run: pnpm pack --pack-destination /tmp/sdk-pack

      - name: Clone ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ matrix.repo == 'ai-memoryless-client' && secrets.PAT_TOKEN_ZETACHAIN || secrets.PAT_TOKEN }}
        run: |
          ORG=${{ matrix.repo == 'ai-memoryless-client' && 'zeta-chain' || 'anuma-ai' }}
          gh repo clone $ORG/${{ matrix.repo }} /tmp/${{ matrix.repo }} -- --depth 1

      - name: Detect package manager
        id: pm
        working-directory: /tmp/${{ matrix.repo }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "cmd=pnpm" >> $GITHUB_OUTPUT
          else
            echo "cmd=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install SDK from tarball
        working-directory: /tmp/${{ matrix.repo }}
        run: |
          ${{ steps.pm.outputs.cmd }} install
          SDK_TARBALL=$(ls /tmp/sdk-pack/*.tgz)
          WORKSPACE_FLAG=""
          if [ "${{ steps.pm.outputs.cmd }}" == "pnpm" ] && [ -f pnpm-workspace.yaml ]; then
            WORKSPACE_FLAG="-w"
          fi
          ${{ steps.pm.outputs.cmd }} add $WORKSPACE_FLAG "$SDK_TARBALL"

      - name: Build ${{ matrix.repo }}
        id: build
        working-directory: /tmp/${{ matrix.repo }}
        continue-on-error: true
        run: ${{ steps.pm.outputs.cmd }} run build

      - name: Install Playwright browsers
        if: matrix.e2e && steps.build.outcome == 'success'
        working-directory: /tmp/${{ matrix.repo }}
        run: ${{ steps.pm.outputs.cmd }} exec playwright install --with-deps chromium

      - name: Run light e2e tests
        id: e2e
        if: matrix.e2e && steps.build.outcome == 'success'
        working-directory: /tmp/${{ matrix.repo }}
        continue-on-error: true
        run: ${{ steps.pm.outputs.cmd }} run test:e2e:light

      - name: Write outcome
        run: |
          mkdir -p /tmp/outcomes
          echo "${{ steps.build.outcome }}" > /tmp/outcomes/${{ matrix.repo }}-${{ matrix.ref }}-build
          if [ "${{ matrix.e2e }}" == "true" ]; then
            echo "${{ steps.e2e.outcome }}" > /tmp/outcomes/${{ matrix.repo }}-${{ matrix.ref }}-e2e
          fi

      - name: Upload outcome
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outcome-${{ matrix.repo }}-${{ matrix.ref }}
          path: /tmp/outcomes/

  report:
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/outcomes
          merge-multiple: true

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="starter-next starter-mini starter-telegram starter-agent dashboard text cli ai-memoryless-client"
          E2E_REPOS="starter-next"

          icon() { [ "$1" == "success" ] && echo "✅" || echo "❌"; }

          has_e2e() {
            for r in $E2E_REPOS; do [ "$r" == "$1" ] && return 0; done
            return 1
          }

          # Build the status table
          TABLE="| | main | PR |
          |---|---|---|"

          ALL_PR_OK=true
          ANY_REGRESSION=false
          BROKEN_REPOS=""

          for REPO in $REPOS; do
            MAIN_BUILD=$(cat /tmp/outcomes/${REPO}-main-build 2>/dev/null || echo "skipped")
            PR_BUILD=$(cat /tmp/outcomes/${REPO}-pr-build 2>/dev/null || echo "skipped")
            TABLE="$TABLE
          | ${REPO} build | $(icon "$MAIN_BUILD") | $(icon "$PR_BUILD") |"

            [ "$PR_BUILD" != "success" ] && ALL_PR_OK=false
            if [ "$PR_BUILD" != "success" ] && [ "$MAIN_BUILD" == "success" ]; then
              ANY_REGRESSION=true
              BROKEN_REPOS="$BROKEN_REPOS $REPO"
            fi

            if has_e2e "$REPO"; then
              MAIN_E2E=$(cat /tmp/outcomes/${REPO}-main-e2e 2>/dev/null || echo "skipped")
              PR_E2E=$(cat /tmp/outcomes/${REPO}-pr-e2e 2>/dev/null || echo "skipped")
              TABLE="$TABLE
          | ${REPO} e2e | $(icon "$MAIN_E2E") | $(icon "$PR_E2E") |"

              [ "$PR_E2E" != "success" ] && ALL_PR_OK=false
              if [ "$PR_E2E" != "success" ] && [ "$PR_E2E" != "skipped" ] && [ "$MAIN_E2E" == "success" ]; then
                ANY_REGRESSION=true
              fi
            fi
          done

          if [ "$ALL_PR_OK" == "true" ]; then
            BODY="<!-- integration-check -->
          ### Integration Check ✅

          $TABLE"
          elif [ "$ANY_REGRESSION" == "true" ]; then
            BODY="<!-- integration-check -->
          ### Integration Check ❌

          This PR introduces regressions in:$(echo "$BROKEN_REPOS" | tr ' ' '\n' | sed '/^$/d' | sed 's/^/ **/' | sed 's/$/**/').

          $TABLE"
          else
            BODY="<!-- integration-check -->
          ### Integration Check ✅ (baseline matches)

          Failures also occur on \`main\` — not caused by this PR.

          $TABLE"
          fi

          echo "$BODY" > /tmp/integration-comment.md

          COMMENT_ID=$(gh api "repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- integration-check -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/{owner}/{repo}/issues/comments/$COMMENT_ID" -X PATCH -F body=@/tmp/integration-comment.md
          else
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/integration-comment.md
          fi

          # Label management — add/remove per-repo labels
          for REPO in $REPOS; do
            LABEL="breaks-${REPO}"
            if echo "$BROKEN_REPOS" | grep -qw "$REPO"; then
              gh label create "$LABEL" --description "PR breaks ${REPO}" --color "d93f0b" 2>/dev/null || true
              gh pr edit ${{ github.event.pull_request.number }} --add-label "$LABEL" || true
            else
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "$LABEL" 2>/dev/null || true
            fi
          done
