name: Integration Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ref: [pr, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || '' }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK
        run: pnpm build

      - name: Pack SDK
        run: pnpm pack --pack-destination /tmp/sdk-pack

      - name: Upload SDK tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.ref }}
          path: /tmp/sdk-pack/*.tgz

  integration:
    needs: pack
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo:
          [
            starter-next,
            starter-mini,
            starter-telegram,
            starter-agent,
            dashboard,
            text,
            cli,
            ai-memoryless-client,
          ]
        include:
          - repo: starter-next
            e2e: true
          - repo: starter-mini
            e2e: false
          - repo: starter-telegram
            e2e: false
          - repo: dashboard
            e2e: false
          - repo: text
            e2e: false
          - repo: starter-agent
            e2e: false
          - repo: cli
            e2e: false
          - repo: ai-memoryless-client
            e2e: false
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
      NEXT_PUBLIC_DROPBOX_APP_KEY: ${{ secrets.NEXT_PUBLIC_DROPBOX_APP_KEY }}
      # ai-memoryless-client's .npmrc reads //registry.npmjs.org/:_authToken=${NPM_TOKEN}
      # for @anuma/nearby, which became a PRIVATE package in that repo's #5718
      # (merged 2026-08-11). Without this the install fails
      # ERR_PNPM_FETCH_404 with "No authorization header was set for the
      # request" — a 404 is what npm answers for a restricted package an
      # anonymous request may not see — so BOTH the `main` and `pr` legs of that
      # matrix entry go red on every SDK PR and the cross-repo signal is lost
      # exactly when it matters. Harmless for the other repos, whose
      # dependencies are all public.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Download SDK tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-*
          path: /tmp/sdk-pack

      - name: Clone ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ matrix.repo == 'ai-memoryless-client' && secrets.PAT_TOKEN_ZETACHAIN || secrets.PAT_TOKEN }}
        run: |
          ORG=${{ matrix.repo == 'ai-memoryless-client' && 'zeta-chain' || 'anuma-ai' }}
          gh repo clone $ORG/${{ matrix.repo }} /tmp/${{ matrix.repo }}-pr -- --depth 1
          cp -a /tmp/${{ matrix.repo }}-pr /tmp/${{ matrix.repo }}-main

      - name: Check against PR SDK
        id: pr
        env:
          REPO: ${{ matrix.repo }}
          E2E: ${{ matrix.e2e }}
        run: bash scripts/integration-leg.sh pr

      - name: Check against main SDK (baseline)
        if: steps.pr.outputs.passed != 'true'
        env:
          REPO: ${{ matrix.repo }}
          E2E: ${{ matrix.e2e }}
        run: bash scripts/integration-leg.sh main

      - name: Upload outcome
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcome-${{ matrix.repo }}
          path: /tmp/outcomes/

  report:
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: outcome-*
          path: /tmp/outcomes
          merge-multiple: true

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOS="starter-next starter-mini starter-telegram starter-agent dashboard text cli ai-memoryless-client"
          E2E_REPOS="starter-next"

          icon() {
            case "$1" in
              success) echo "✅" ;;
              not-run) echo "—" ;;
              *) echo "❌" ;;
            esac
          }

          has_e2e() {
            for r in $E2E_REPOS; do [ "$r" == "$1" ] && return 0; done
            return 1
          }

          # Build the status table
          TABLE="| | main | PR |
          |---|---|---|"

          ALL_PR_OK=true
          ANY_REGRESSION=false
          ANY_BASELINE_SKIPPED=false
          BROKEN_REPOS=""

          for REPO in $REPOS; do
            MAIN_BUILD=$(cat /tmp/outcomes/${REPO}-main-build 2>/dev/null || echo "not-run")
            [ "$MAIN_BUILD" == "not-run" ] && ANY_BASELINE_SKIPPED=true
            PR_BUILD=$(cat /tmp/outcomes/${REPO}-pr-build 2>/dev/null || echo "skipped")
            TABLE="$TABLE
          | ${REPO} build | $(icon "$MAIN_BUILD") | $(icon "$PR_BUILD") |"

            [ "$PR_BUILD" != "success" ] && ALL_PR_OK=false
            if [ "$PR_BUILD" != "success" ] && [ "$MAIN_BUILD" == "success" ]; then
              ANY_REGRESSION=true
              BROKEN_REPOS="$BROKEN_REPOS $REPO"
            fi

            if has_e2e "$REPO"; then
              MAIN_E2E=$(cat /tmp/outcomes/${REPO}-main-e2e 2>/dev/null || echo "not-run")
              PR_E2E=$(cat /tmp/outcomes/${REPO}-pr-e2e 2>/dev/null || echo "skipped")
              TABLE="$TABLE
          | ${REPO} e2e | $(icon "$MAIN_E2E") | $(icon "$PR_E2E") |"

              [ "$PR_E2E" != "success" ] && ALL_PR_OK=false
              if [ "$PR_E2E" != "success" ] && [ "$PR_E2E" != "skipped" ] && [ "$MAIN_E2E" == "success" ]; then
                ANY_REGRESSION=true
              fi
            fi
          done

          if [ "$ANY_BASELINE_SKIPPED" == "true" ]; then
            TABLE="$TABLE

          — main baseline skipped: it only builds when the PR leg fails."
          fi

          if [ "$ALL_PR_OK" == "true" ]; then
            BODY="<!-- integration-check -->
          ### Integration Check ✅

          $TABLE"
          elif [ "$ANY_REGRESSION" == "true" ]; then
            BODY="<!-- integration-check -->
          ### Integration Check ❌

          This PR introduces regressions in:$(echo "$BROKEN_REPOS" | tr ' ' '\n' | sed '/^$/d' | sed 's/^/ **/' | sed 's/$/**/').

          $TABLE"
          else
            BODY="<!-- integration-check -->
          ### Integration Check ✅ (baseline matches)

          Failures also occur on \`main\` — not caused by this PR.

          $TABLE"
          fi

          echo "$BODY" > /tmp/integration-comment.md

          COMMENT_ID=$(gh api "repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- integration-check -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/{owner}/{repo}/issues/comments/$COMMENT_ID" -X PATCH -F body=@/tmp/integration-comment.md
          else
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/integration-comment.md
          fi

          # Label management — add/remove per-repo labels
          for REPO in $REPOS; do
            LABEL="breaks-${REPO}"
            if echo "$BROKEN_REPOS" | grep -qw "$REPO"; then
              gh label create "$LABEL" --description "PR breaks ${REPO}" --color "d93f0b" 2>/dev/null || true
              gh pr edit ${{ github.event.pull_request.number }} --add-label "$LABEL" || true
            else
              gh pr edit ${{ github.event.pull_request.number }} --remove-label "$LABEL" 2>/dev/null || true
            fi
          done
