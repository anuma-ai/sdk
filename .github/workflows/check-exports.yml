name: Check Exports

# Validates that the package exports map and types resolve correctly for
# ESM and CJS consumers. Catches broken import paths and type resolution
# issues that are invisible during development but break published consumers.

on:
  merge_group:
  pull_request:
    branches: [main]

jobs:
  check-exports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Check Exports
        run: pnpm check-exports

  # Same family of invariant, about whether a public memory export has any
  # consumer at all. See MEMORY_EXPORT_CONSUMERS.md. Its own job: needs no build.
  export-consumers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Check Memory Export Consumers
        run: pnpm check:export-consumers
