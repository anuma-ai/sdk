name: Check Exports

# Validates that the package exports map and types resolve correctly for
# ESM and CJS consumers. Catches broken import paths and type resolution
# issues that are invisible during development but break published consumers.

on:
  merge_group:
  pull_request:
    branches: [main]

jobs:
  check-exports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Check Exports
        run: pnpm check-exports

  # Same family of invariant, about whether a public memory export has any
  # consumer at all. See MEMORY_EXPORT_CONSUMERS.md. Its own job: needs no build.
  export-consumers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      # No `cache: "pnpm"` here on purpose. This job has no install step, so
      # nothing ever creates the pnpm store - and setup-node's post-job save
      # then fails with "Path Validation Error: Path(s) specified in the action
      # for caching do(es) not exist" whenever the cache key MISSES. The key is
      # hashed from pnpm-lock.yaml, so the job passed only because most PRs
      # leave the lockfile alone; every lockfile-touching PR, such as a
      # dependency bump, failed a check it has nothing to do with.
      #
      # Caching is pointless here regardless:
      # `scripts/assert-export-consumers.mjs` imports only node:fs /
      # node:path / node:url and passes with node_modules absent entirely.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Check Memory Export Consumers
        run: pnpm check:export-consumers
