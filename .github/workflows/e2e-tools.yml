name: E2E Tools

permissions:
  contents: read

on:
  merge_group:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test (leave empty for default deepinfra/moonshotai/Kimi-K2.6)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "fireworks/accounts/fireworks/models/glm-5"
          - "minimax/MiniMax-M2.7"
          - "anthropic/claude-sonnet-4-6"
          - "gemini/gemini-3.1-pro-preview"
          - "openai/gpt-5.4"
          - "all"
      test_filter:
        description: "Vitest file filter (e.g. 'weather' to match weather.ts — leave empty for all tests)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.model || 'default' }}
  cancel-in-progress: true

jobs:
  e2e-tools:
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.event.inputs.model != 'all')
    runs-on: ubuntu-latest
    # Derived, not guessed: must exceed the largest per-test budget the suite
    # is allowed to use, plus checkout + `pnpm install`. The longest included
    # test is test/tools/app-generation/kanban.test.ts at `timeout: 1_500_000`
    # (25 min); photo-gallery.test.ts is at 900_000 (15 min). A job budget at
    # or below those can kill a test that is still inside its own budget, and
    # the allowlist below would then report that as a failure — which is the
    # same class of bug this file is fixing, one level up.
    #
    # If you add a test with a larger `timeout:`, raise this with it. It was 5
    # minutes, which every run hit; `cancelled` then read as pass.
    timeout-minutes: 30
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      ANUMA_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_SHARED_DRIVE_ID }}
      E2E_MODEL: ${{ github.event.inputs.model || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run e2e tool tests
        env:
          TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
        run: pnpm e2e:tools "$TEST_FILTER"

  e2e-tools-compat:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.model == 'all'
    runs-on: ubuntu-latest
    # Same suite, same per-test budgets as `e2e-tools` above — so the same
    # figure. At 10 this matrix could not finish, and once the allowlist below
    # stops passing `cancelled`, a dispatch with model=all would fail every
    # time on the timeout alone.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - "fireworks/accounts/fireworks/models/glm-5"
          - "minimax/MiniMax-M2.7"
          - "anthropic/claude-sonnet-4-6"
          - "gemini/gemini-3.1-pro-preview"
          - "openai/gpt-5.4"
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      ANUMA_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_SHARED_DRIVE_ID }}
      E2E_MODEL: ${{ matrix.model }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run e2e tool tests (${{ matrix.model }})
        env:
          TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
        run: pnpm e2e:tools "$TEST_FILTER"

  e2e-tools-status:
    if: always()
    needs: [e2e-tools, e2e-tools-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Check e2e results
        run: |
          # Allowlist, NOT a failure-check: a job killed by `timeout-minutes`
          # concludes `cancelled`, and an `== "failure"` test lets that through.
          # Observed on run 30302039028 — e2e-tools hit its 5m timeout, concluded
          # `cancelled`, and this REQUIRED status went green 3s later with the
          # tests never having run to completion.
          for r in "${{ needs.e2e-tools.result }}" "${{ needs.e2e-tools-compat.result }}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "E2E tool tests did not pass (result: $r)"
              exit 1
            fi
          done
          echo "E2E tool tests passed (or skipped)"
