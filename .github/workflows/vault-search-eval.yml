name: Vault Search Eval

# Retrieval-quality gate for the vault ranking stack (recall@k / precision@k /
# MRR / NDCG / ranking-violation rate over a 108-memory, 100-query corpus).
#
# Unlike the extraction/topic/consolidation gates, this one is DETERMINISTIC:
# the frozen embedding cache means the same code scores identically every run,
# which is why a flat 1% regression threshold is safe here instead of the
# spread-derived tolerances those LLM-driven suites need. The only API calls are
# embeddings, and only on a cache miss — no answer LLM, so this is the cheapest
# retrieval gate available.
#
# Determinism holds only against a baseline generated with the SAME ranker,
# lanes, and embedding model, so the baseline records its config and the
# benchmark refuses to compare across a mismatch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "gate = fail on regression vs committed baseline; save-baseline = write a new baseline artifact; sweep = ungated ablation, paired against the first head"
        required: false
        type: choice
        default: "gate"
        options: ["gate", "save-baseline", "sweep"]
      refresh_embeddings:
        description: "Re-embed from scratch instead of reusing the frozen cache (use after an embedding-model change)"
        required: false
        type: choice
        default: "false"
        options: ["false", "true"]
      # `sweep` only. The gate arms stay pinned to the committed baselines'
      # config — a knob passed there would be refused as a config mismatch,
      # which is the correct behaviour and not what these are for.
      ce_weight:
        # anuma-ai/sdk#845 asked for the head sweep to be repeated at a higher
        # CE weight before the default head moves (#909). At the shipped 0.1 the
        # cross-encoder barely moves a score, so "heads 5 and 30 are identical"
        # may only mean the CE is near-inert — not that its head size is free.
        description: "sweep: cross-encoder blend weight (blank = SDK default 0.1)"
        required: false
        type: string
        default: ""
      heads:
        description: "sweep: comma-separated rerank head sizes. The FIRST is the reference every later arm is paired against."
        required: false
        type: string
        default: "30,5"
  # ADVISORY gate — see .github/workflows/EVAL_GATES.md for why, and for the
  # three-step recipe to make it blocking. In short: paths-scoped means no run
  # (and so NO status) on an unrelated PR, which is why `vault-search-eval-status` must not
  # be added to main's required checks in this shape.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vault-search-eval.yml"
      # The ranking stack itself.
      - "src/lib/memoryVault/**"
      # The candidate-set filtering itself. searchTool calls
      # getVaultCandidateKeysOp / getAllVaultMemoriesOp on every search, so the
      # scope/folder/factTypes/includeArchived logic that decides WHICH rows are
      # even eligible lives here. Without this glob a change confined to the DB
      # layer skips the gate entirely — #780 is exactly such a change and only
      # tripped these gates because it happened to also touch searchTool.ts.
      - "src/lib/db/memoryVault/**"
      - "src/lib/memory/recall.ts"
      - "src/lib/memory/recallConstants.ts"
      - "src/lib/memory/rrf.ts"
      - "src/lib/memory/mmr.ts"
      - "src/lib/memory/recency.ts"
      - "src/lib/memory/queryEntities.ts"
      - "src/lib/memory/graphTraversal.ts"
      - "src/lib/memory/reranker.ts"
      # Every score is a cosine over embeddings, so the whole engine is in
      # scope. embeddings.ts builds on `chunking` (chunk size / split logic),
      # `generate` (the embed HTTP client), `constants` (the model id) and
      # `vector`/`quantization` — listing only two files let edits to the others
      # move gated retrieval without running this gate. A directory glob can
      # only over-trigger, which is the safe direction for a gate.
      - "src/lib/memoryEngine/**"
      # The corpus, scorer, and shared gate helper.
      - "test/memory/src/vault/**"
      - "test/memory/src/metrics.ts"
      - "test/memory/src/gate.ts"

  # The ONLY thing that seeds the shared caches. Actions scopes a cache to the
  # ref that created it, so one born under refs/pull/N/merge is invisible to
  # every other PR; without this main-branch run each PR cold-starts and re-pulls
  # the dataset (HuggingFace 429s) and re-embeds. With merge_group now removed
  # this is the sole seeder — do not prune it as a duplicate of the PR trigger.
  push:
    branches: [main]
    paths:
      - ".github/workflows/vault-search-eval.yml"
      # The ranking stack itself.
      - "src/lib/memoryVault/**"
      # The candidate-set filtering itself. searchTool calls
      # getVaultCandidateKeysOp / getAllVaultMemoriesOp on every search, so the
      # scope/folder/factTypes/includeArchived logic that decides WHICH rows are
      # even eligible lives here. Without this glob a change confined to the DB
      # layer skips the gate entirely — #780 is exactly such a change and only
      # tripped these gates because it happened to also touch searchTool.ts.
      - "src/lib/db/memoryVault/**"
      - "src/lib/memory/recall.ts"
      - "src/lib/memory/recallConstants.ts"
      - "src/lib/memory/rrf.ts"
      - "src/lib/memory/mmr.ts"
      - "src/lib/memory/recency.ts"
      - "src/lib/memory/queryEntities.ts"
      - "src/lib/memory/graphTraversal.ts"
      - "src/lib/memory/reranker.ts"
      # Every score is a cosine over embeddings, so the whole engine is in
      # scope. embeddings.ts builds on `chunking` (chunk size / split logic),
      # `generate` (the embed HTTP client), `constants` (the model id) and
      # `vector`/`quantization` — listing only two files let edits to the others
      # move gated retrieval without running this gate. A directory glob can
      # only over-trigger, which is the safe direction for a gate.
      - "src/lib/memoryEngine/**"
      # The corpus, scorer, and shared gate helper.
      - "test/memory/src/vault/**"
      - "test/memory/src/metrics.ts"
      - "test/memory/src/gate.ts"

jobs:
  vault-search-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
      INPUT_MODE: ${{ inputs.mode || 'gate' }}
      INPUT_REFRESH: ${{ inputs.refresh_embeddings || 'false' }}
      # Free-form string inputs reach the shell as env vars, never as ${{ }}
      # interpolation, so the value is tokenized after substitution rather than
      # spliced into the script — same reason longmemeval.yml routes its string
      # inputs this way.
      INPUT_CE_WEIGHT: ${{ inputs.ce_weight }}
      INPUT_HEADS: ${{ inputs.heads || '30,5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm BEFORE setup-node: `cache: "pnpm"` resolves the store by running
      # `pnpm store path`, so pnpm has to be on PATH by then. Corepack-enabling
      # afterwards (what this workflow used to do) left setup-node with no pnpm and
      # no cache, which is why these runs re-downloaded all ~1610 packages every
      # time. Matches test.yml, which has always had it in this order.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        # --frozen-lockfile so a lockfile that drifted from package.json fails here
        # instead of being silently re-resolved, which also means the restored store
        # is always the one the lockfile describes.
        run: pnpm install --frozen-lockfile

      # The frozen vectors are gitignored (a few MB of float arrays), so cache
      # them across runs — otherwise every PR re-embeds 208 texts. Keyed on the
      # corpus AND the embedding-model constant, so either changing produces a
      # fresh key rather than silently reusing stale vectors. (The benchmark
      # also self-invalidates: the cache file records its model.)
      - name: Restore frozen embedding cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/memory/src/vault/embeddings-cache.json
          key: vault-embeddings-v1-${{ hashFiles('test/memory/src/vault/dataset.ts', 'src/lib/memoryEngine/constants.ts') }}

      - name: Run eval (regression gate)
        if: env.INPUT_MODE == 'gate'
        run: |
          # TWO arms, because one of them is the configuration we actually ship.
          #
          #   control    cosine, no rerank        — the cheap arm
          #   production fused + cross-encoder    — `budget: 'mid'`, which web
          #              resolves to on 98.7% of production recall turns
          #
          # Until 2026-08-13 only `control` ran here, so the shipped ranking path
          # had no regression gate at all: a change that broke fusion or the
          # cross-encoder scored green because neither was switched on.
          #
          # `--output` rather than `| tee`: the benchmark writes the result
          # document to the file itself and logs only to stderr, so the summary
          # below gets clean JSON. Piping stdout also can't work on the path that
          # matters — the gate exits non-zero on a regression, and the file must
          # already exist by then (it's written before the comparison runs).
          extra=()
          [ "$INPUT_REFRESH" = "true" ] && extra+=(--refresh-embeddings)

          # Both arms run even when the first regresses, then the step fails at
          # the end. Chaining with `&&` would hide the production result behind a
          # control regression — the two are independent questions and a reviewer
          # needs both numbers to tell "ranking got worse" from "fusion broke".
          rc=0
          pnpm --silent eval:vault-search --json \
            --output results.json \
            --baseline test/memory/src/vault/baseline.json \
            "${extra[@]}" || rc=1
          pnpm --silent eval:vault-search --json --ranker fused --rerank \
            --output results-production.json \
            --baseline test/memory/src/vault/baseline-production.json \
            "${extra[@]}" || rc=1
          exit $rc

      - name: Run eval (ablation sweep)
        if: env.INPUT_MODE == 'sweep'
        run: |
          set -uo pipefail

          # No `--baseline`. The gate branch in benchmark.test.ts is `else if
          # (args.baseline)`, so omitting the flag skips regression gating
          # outright — a sweep deliberately runs configurations no committed
          # baseline describes, and gating them would only ever report the
          # config mismatch.
          extra=()
          [ "$INPUT_REFRESH" = "true" ] && extra+=(--refresh-embeddings)
          if [ -n "$INPUT_CE_WEIGHT" ]; then
            extra+=(--ce-weight "$INPUT_CE_WEIGHT")
          fi

          IFS=',' read -r -a heads <<< "$INPUT_HEADS"
          [ "${#heads[@]}" -ge 2 ] || { echo "heads needs at least two values, got '$INPUT_HEADS'"; exit 1; }
          for h in "${heads[@]}"; do
            case "$h" in
              ''|*[!0-9]*) echo "Invalid head '$h' in '$INPUT_HEADS'. Expected positive integers."; exit 1 ;;
            esac
            [ "$h" -ge 1 ] || { echo "Invalid head '$h'. Must be >= 1."; exit 1; }
          done

          # The first head is the reference; every later arm is `--compare`d
          # against it for a paired bootstrap over the same 100 queries. That
          # paired delta is the only statistic this corpus can state with
          # confidence — per EVAL_GATES.md it cannot resolve a 1-2pp change in
          # absolute terms, but it CAN say whether two heads score each query
          # identically.
          ref="${heads[0]}"
          {
            echo "## Vault search eval — ablation sweep"
            echo
            echo "\`ce-weight\`: \`${INPUT_CE_WEIGHT:-0.1 (SDK default)}\` · heads: \`$INPUT_HEADS\` · reference: \`$ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

          for h in "${heads[@]}"; do
            cmp=()
            [ "$h" != "$ref" ] && cmp+=(--compare "arm-head-$ref.json")
            echo "::group::head $h"
            # stderr carries progress AND the paired-bootstrap block (stdout is
            # reserved for the result document, which --output redirects to a
            # file), so merge it to capture the delta in the log and summary.
            pnpm --silent eval:vault-search --json --ranker fused --rerank \
              --rerank-top-n "$h" \
              --output "arm-head-$h.json" \
              "${extra[@]}" "${cmp[@]}" 2>&1 | tee "arm-head-$h.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "head $h failed (exit $rc)"; exit "$rc"; }

            {
              echo
              echo "### head $h$([ "$h" = "$ref" ] && echo ' (reference)')"
              echo '```'
              jq -r '
                .overall as $o |
                "  recall@k   : \(($o.recallAtK*1000|round/10))%",
                "  precision@k: \(($o.precisionAtK*1000|round/10))%",
                "  MRR        : \(($o.mrr*1000|round/10))%",
                "  NDCG       : \(($o.ndcg*1000|round/10))%",
                "  ranking violations: \(($o.rankingViolationRate*1000|round/10))%"
              ' "arm-head-$h.json" 2>/dev/null || echo "  (could not parse arm-head-$h.json)"
              # The paired block is the point of the sweep, so lift it out of
              # the log rather than making a reader open the raw step output.
              sed -n '/[Pp]aired/,$p' "arm-head-$h.log" | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload sweep results
        if: always() && env.INPUT_MODE == 'sweep'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-search-sweep-results
          # The per-arm documents carry `perQuery` rows, which is what a later
          # run needs as a `--compare` target — without them a follow-up sweep
          # cannot be paired against this one.
          path: |
            arm-head-*.json
            arm-head-*.log
          if-no-files-found: ignore

      - name: Run eval (save baseline)
        if: env.INPUT_MODE == 'save-baseline'
        run: |
          set -o pipefail
          extra=()
          [ "$INPUT_REFRESH" = "true" ] && extra+=(--refresh-embeddings)
          # Regenerate BOTH arms together. Capturing only one leaves the other
          # pinned to an older corpus/model, and the config block would no longer
          # explain the divergence — they must move as a pair.
          pnpm --silent eval:vault-search --save-baseline \
            --baseline test/memory/src/vault/baseline.json "${extra[@]}"
          pnpm --silent eval:vault-search --save-baseline --ranker fused --rerank \
            --baseline test/memory/src/vault/baseline-production.json "${extra[@]}"
          for f in baseline baseline-production; do
            echo "### Generated $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "test/memory/src/vault/$f.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload generated baseline
        if: env.INPUT_MODE == 'save-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-search-baseline
          path: |
            test/memory/src/vault/baseline.json
            test/memory/src/vault/baseline-production.json
          if-no-files-found: error

      - name: Summarize
        if: always() && env.INPUT_MODE == 'gate'
        run: |
          {
            echo "## Vault search eval — retrieval quality vs committed baseline"
            for arm in "control:results.json" "production (fused+CE):results-production.json"; do
            label="${arm%%:*}"; file="${arm##*:}"
            echo "### $label"
            if [ -f "$file" ]; then
              echo '```'
              jq -r '
                .overall as $o |
                "  recall@k   : \(($o.recallAtK*1000|round/10))%",
                "  precision@k: \(($o.precisionAtK*1000|round/10))%",
                "  MRR        : \(($o.mrr*1000|round/10))%",
                "  NDCG       : \(($o.ndcg*1000|round/10))%",
                "  ranking violations: \(($o.rankingViolationRate*1000|round/10))%",
                "",
                "  by category:",
                (.byCategory[] | "    \(.category | . + (" " * (16 - length)))recall \((.recallAtK*1000|round/10))%  ndcg \((.ndcg*1000|round/10))%")
              ' "$file" 2>/dev/null || echo "  (could not parse $file)"
              echo '```'
            else
              echo "_Gate did not produce a result (eval step failed before writing $file)._"
            fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-search-eval-results
          # BOTH arms. The production document carries its own `perQuery` rows,
          # which are what a later run needs as a `--compare` target for a paired
          # bootstrap — uploading only the control silently makes the shipped
          # arm the one you cannot analyse after the fact.
          path: |
            results.json
            results-production.json
          if-no-files-found: ignore

  # Reports this gate's outcome as one stable line. See the advisory note on
  # the pull_request trigger for why it is not a required check today.
  vault-search-eval-status:
    if: always()
    needs: [vault-search-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Check vault search gate result
        run: |
          # Allowlist, not a failure check: a timed-out job concludes
          # `cancelled` and would otherwise post green. See EVAL_GATES.md.
          result="${{ needs.vault-search-eval.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "Vault search eval gate did not pass (result: $result)"
            exit 1
          fi
          echo "Vault search eval gate passed"
